<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Form Auto-Fill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>AI Form Auto-Fill</h1>
    
    <div class="settings">
      <label for="provider-select">AI服务商:</label>
      <select id="provider-select">
        <option value="openrouter">OpenRouter</option>
        <option value="zhipu">智谱 GLM（免费）</option>
        <option value="siliconflow">硅基流动（免费）</option>
        <option value="opencode">OpenCode</option>
        <option value="local">本地模型</option>
      </select>
    </div>

    <div class="settings" id="custom-url-setting" style="display: none;">
      <label for="custom-base-url">API 地址:</label>
      <input type="text" id="custom-base-url" placeholder="http://localhost:8080">
    </div>

    <div class="settings" id="api-key-setting">
      <label for="api-key">API密钥:</label>
      <input type="password" id="api-key" placeholder="输入API密钥">
      <button id="save-key-btn">保存</button>
    </div>

    <div class="model-setting" id="model-setting">
      <label for="model-input">模型:</label>
      <select id="model-select">
        <option value="GLM-4.7-Flash">GLM-4.7-Flash（免费）</option>
        <option value="GLM-4.5-Flash">GLM-4.5-Flash（免费）</option>
        <option value="GLM-4-Air">GLM-4-Air</option>
        <option value="GLM-4">GLM-4</option>
      </select>
      <input type="text" id="model-input" placeholder="或手动输入模型ID" style="display:none;">
    </div>
    
    <div id="form-list">
      <p>点击"检测表单"按钮开始</p>
    </div>

    <div class="actions">
      <button id="detect-btn">检测表单</button>
      <button id="get-suggestions-btn" disabled>获取AI建议</button>
    </div>

    <div id="fill-actions" style="display: none;">
      <button id="fill-btn" class="fill-direct">直接填充</button>
      <button id="preview-btn" class="fill-preview">预览模式</button>
    </div>
    
    <div id="status"></div>
  </div>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
