<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>管理配置文件</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>管理配置文件</h1>
    
    <div class="profile-form">
      <input type="text" id="profile-name" placeholder="配置文件名称">
      <textarea id="profile-data" placeholder="用户数据 (JSON格式)"></textarea>
      <button id="save-profile-btn">保存配置文件</button>
    </div>
    
    <div id="profile-list"></div>
    
    <button id="back-btn">返回</button>
  </div>
  
  <script type="module" src="popup-profiles.js"></script>
</body>
</html>
